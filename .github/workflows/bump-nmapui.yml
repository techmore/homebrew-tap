name: Bump nmapui

# Opens a PR that points Formula/nmapui.rb at the newest TM-NmapUI release
# (or a given tag): archive sha256 plus regenerated wheel resources.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "TM-NmapUI release tag (default: latest release)"
        required: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-nmapui
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view -R techmore/TM-NmapUI --json tagName -q .tagName)"
          fi
          [[ "$tag" =~ ^v?[0-9][0-9A-Za-z._-]*$ ]] || { echo "unexpected tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update the formula
        run: python3 -I scripts/bump_nmapui.py --ref "${{ steps.release.outputs.tag }}" --version "${{ steps.release.outputs.version }}"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "nmapui is already at $VERSION"; exit 0; fi
          branch="bump-nmapui-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "$branch already open"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "nmapui $VERSION"
          git push origin "$branch"
          if ! gh pr create --title "nmapui $VERSION" --body "Automated bump from the TM-NmapUI release. Review, then run \`brew install --build-from-source techmore/tap/nmapui\` and \`brew test nmapui\` on an Apple Silicon Mac before merging."; then
            # Repos can forbid Actions from opening PRs; the branch is pushed either way.
            echo "::warning::Could not open a PR automatically. Open one from branch $branch: https://github.com/${GITHUB_REPOSITORY}/pull/new/$branch"
          fi
