name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tap-syntax:
    # Linux only: macOS runners are metered. Formulae are not built here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/homebrew/brew:main
    defaults:
      run:
        shell: bash -xeuo pipefail {0}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew style techmore/tap

      - run: brew audit --tap=techmore/tap
